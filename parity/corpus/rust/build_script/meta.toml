# Pins for reproducible golden capture (RazelParityHarness.md §5/§9).
# Refresh with: cargo xtask capture-goldens
bazel_version      = "9.1.1"
rules_rust_version = "0.70.0"
platform           = "darwin_arm64"   # aquery is post-analysis → goldens are platform-pinned
norm_version       = 3                # razel-parity::normalize spec (3 = + the ` (TreeArtifact)` strip;
                                      # the wrapper-prefix + deviation handling are diff-time, A1/A3)
query              = "aquery //corpus/rust/build_script:all --output=text"
