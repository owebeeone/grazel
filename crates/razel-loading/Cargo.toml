[package]
name = "razel-loading"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
allocative = "0.3.6"
anyhow = "1.0.102"
razel-core = { version = "0.1.0", path = "../razel-core" }
razel-dds = { version = "0.1.0", path = "../razel-dds" } # C2: the provider model IS the DDS value algebra (one fold)
razel-ir = { version = "0.1.0", path = "../razel-ir" }
# The cc engine the `razel_cc` builtin wraps (Constrain + the config). Layering wart (loader →
# engine) — temporary; the registration seam moves to razel-adapter-bazel at Phase C3.
razel-cc-toolchain = { version = "0.1.0", path = "../razel-cc-toolchain" }
razel-rulepack = { version = "0.1.0", path = "../razel-rulepack" }
serde = { version = "1", features = ["derive"] } # crate-universe P2.1: MODULE.bazel.lock reader
serde_json = "1"
sha2 = "0.10" # crate-universe P2.3/P2.6: sha256 of the lock's FILE inputs + .crate downloads
starlark = "0.14.2"

[dev-dependencies]
razel-parity = { version = "0.1.0", path = "../razel-parity" }
