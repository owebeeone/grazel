[package]
name = "razel-query"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# `razel query` (RazelCrateUniverseDesign Part B): the Bazel-query-expression language over the
# §11 loading-phase graph (`razel_loading`'s LoadedTarget/QueryNode). It READS the graph and never
# analyzes — so it depends on razel-loading + leaf utils ONLY, NEVER razel-build/analysis/exec/
# engine. The boundary is a denylist enforced by `cargo xtask gates` (plan P1.0).
[dependencies]
razel-loading = { version = "0.1.0", path = "../razel-loading" }
razel-core = { version = "0.1.0", path = "../razel-core" }
regex = "1"
