[package]
name = "razel-process-wrapper"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# crate-universe P3.8 (§5.2): the exec-time process wrapper (rules_rust `process_wrapper`
# analogue). Subcommands: `build-script` (P3.8 — run a cargo build script, capture stdout → the
# §6.1 flags file) and `rustc` (P3.9 — apply a flags file to a rustc invocation). Deliberately
# LIGHT (serde only, no starlark) so it stays a thin per-action exec-time binary.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Test-only: the A7 execution-parity (xp) gate drives a full razel build of the local build-script
# corpus case THROUGH this wrapper (resolved via CARGO_BIN_EXE_razel-process-wrapper) and asserts
# the produced rlib + flags-file. razel-build does NOT depend on this crate (the wrapper is resolved
# at exec by name/path), so this dev-only edge introduces no dependency cycle.
[dev-dependencies]
razel-build = { path = "../razel-build" }
razel-exec = { path = "../razel-exec" }
tempfile = "3"
