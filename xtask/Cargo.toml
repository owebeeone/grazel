[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Project automation (the Rust idiom in place of Make/npm-scripts). Run via the
# `cargo xtask` alias (.cargo/config.toml). Builds only when invoked.

[dependencies]
razel-loading = { path = "../crates/razel-loading" } # the ladder probe drives the engine (probe)
razel-parity = { path = "../crates/razel-parity" } # shared golden normalization (capture-goldens)
razel-build = { path = "../crates/razel-build" } # S4b: examples harness runs targets
razel-exec = { path = "../crates/razel-exec" } # S4b: cache for harness builds
razel-deps-engine = { path = "../crates/razel-deps-engine" } # taut fact (de)serialization for the tfload cache
razel-core = { path = "../crates/razel-core" } # content Digest for the tfload cache key
serde_json = "1" # fetch R1: the repo lockfile writer (RazelFetchPlan §3)
flate2 = "1" # tfload cache: compress the (highly repetitive) serialized facts
